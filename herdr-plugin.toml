id = "herdr-splits"
name = "Herdr Splits"
version = "0.5.3"
min_herdr_version = "0.7.0"
description = "Seamless navigation and resizing between Herdr panes and Neovim splits"
platforms = ["linux", "macos", "windows"]

# Herdr-side navigation actions. These check if the focused pane is running
# Neovim and either forward the key chord or move Herdr pane focus.
# Bind them in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = "ctrl+h"
#   type = "plugin_action"
#   command = "herdr-splits.nav-left"
#
# Herdr has no per-platform `command` form and rejects duplicate action ids,
# so the Windows variants are separate actions with a `-windows` suffix. Each
# action declares the platforms it supports; Herdr refuses to invoke one that
# does not match the host, so the inapplicable half is inert.

[[actions]]
id = "nav-left"
title = "Navigate left (Neovim/Herder)"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/herdr-nav.sh", "left"]

[[actions]]
id = "nav-left-windows"
title = "Navigate left (Neovim/Herder)"
contexts = ["global"]
platforms = ["windows"]
command = [
  "powershell.exe",
  "-NoLogo",
  "-NoProfile",
  "-NonInteractive",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  'scripts\herdr-nav.ps1',
  "left",
]

[[actions]]
id = "nav-down"
title = "Navigate down (Neovim/Herder)"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/herdr-nav.sh", "down"]

